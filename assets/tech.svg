  <text x="30" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.5" fill="#64748B">TOOLS &amp; SYSTEMS</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#C7D2E5" text-anchor="middle">
