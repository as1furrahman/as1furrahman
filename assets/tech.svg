  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#C7D2E5" text-anchor="middle">
    <rect x="30" y="48" width="124" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="92" y="75">Python</text>
    <rect x="166" y="48" width="124" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="228" y="75">C</text>
    <rect x="302" y="48" width="124" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="364" y="75">C++</text>
    <rect x="438" y="48" width="124" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="500" y="75">Java</text>
    <rect x="574" y="48" width="124" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="636" y="75">JavaScript</text>
    <rect x="710" y="48" width="124" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="772" y="75">Ruby</text>
