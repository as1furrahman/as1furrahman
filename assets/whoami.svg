<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="Terminal session: whoami, focus, uptime">
  <defs>
    <clipPath id="win"><rect width="760" height="380" rx="16"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#151B2E"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#win)">
    <rect width="760" height="380" fill="#0D1322"/>
    <rect width="760" height="44" fill="url(#bar)"/>
    <rect y="43" width="760" height="1" fill="#21283B"/>
  </g>

  <circle cx="26" cy="22" r="6" fill="#6366F1"/>
  <circle cx="48" cy="22" r="6" fill="#8B5CF6"/>
  <circle cx="70" cy="22" r="6" fill="#22D3EE"/>
  <text x="380" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#64748B">asifur@arch — zsh</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <text x="26" y="82" fill="#22D3EE">&#10095;</text>
    <text x="48" y="82" fill="#E6EDF3">whoami</text>
    <text x="28" y="108" fill="#94A3B8">Asifur Rahman — Linux enthusiast &amp; systems tinkerer</text>

    <text x="26" y="160" fill="#22D3EE">&#10095;</text>
    <text x="48" y="160" fill="#E6EDF3">cat ~/focus</text>
    <text x="28" y="186" fill="#C4B5FD">&#9656;</text>
    <text x="48" y="186" fill="#94A3B8">Systems engineering &amp; Linux internals</text>
    <text x="28" y="212" fill="#C4B5FD">&#9656;</text>
    <text x="48" y="212" fill="#94A3B8">DevOps — Docker · CI/CD · Infrastructure as Code</text>
    <text x="28" y="238" fill="#C4B5FD">&#9656;</text>
    <text x="48" y="238" fill="#94A3B8">Minimal tools that just work</text>

    <text x="26" y="290" fill="#22D3EE">&#10095;</text>
    <text x="48" y="290" fill="#E6EDF3">uptime</text>
    <text x="28" y="316" fill="#94A3B8">up since 2023 · still learning, always shipping</text>

    <text x="26" y="348" fill="#22D3EE">&#10095;</text>
    <rect x="48" y="336" width="10" height="16" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="759" height="379" rx="16" fill="none" stroke="#21283B"/>
</svg>
