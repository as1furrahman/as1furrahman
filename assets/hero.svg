<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Asifur Rahman — Linux Enthusiast, Systems and DevOps">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#E6EDF3" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#0A0E1A"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="180" cy="70" r="220" fill="url(#orbA)">
    <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;130;70" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="300" r="240" fill="url(#orbB)">
    <animate attributeName="cx" values="1030;880;1030" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;230;300" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="360" r="230" fill="url(#orbC)" opacity="0.7">
    <animate attributeName="cx" values="620;720;620" dur="18s" repeatCount="indefinite"/>
  </circle>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#accent)" stroke-opacity="0.35"/>

  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-1" fill="url(#ink)">Asifur Rahman</text>

  <text x="600" y="196" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="3" fill="#94A3B8">LINUX ENTHUSIAST · SYSTEMS &amp; DEVOPS</text>

  <g transform="translate(600,240)">
    <rect x="-140" y="0" width="280" height="42" rx="21" fill="#0F1424" stroke="url(#accent)" stroke-opacity="0.6"/>
    <circle cx="-112" cy="21" r="5" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="-96" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#E6EDF3">Open to opportunities</text>
  </g>
</svg>
