    <rect x="348" y="142" width="146" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="421" y="169">Bash</text>
    <rect x="506" y="142" width="146" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
    <text x="579" y="169">Git</text>
    <rect x="664" y="142" width="146" height="44" rx="11" fill="#121829" stroke="url(#stroke)" stroke-opacity="0.35"/>
